name: pos_app
description: "A modern POS mobile app with Email & OTP authentication."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  google_fonts: ^6.1.0
  flutter_secure_storage: ^9.0.0
  drift: ^2.16.0
  drift_flutter: ^0.1.0
  path_provider: ^2.1.2
  path: ^1.9.0
  file_picker: ^11.0.3
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.5.0
  permission_handler: ^12.0.3
  flutter_jailbreak_detection: ^1.1.0
  mobile_scanner: ^6.0.11
  print_bluetooth_thermal: ^1.2.1
  esc_pos_utils_plus: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/quicke_logo_opaque.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/quicke_logo_opaque.png"

