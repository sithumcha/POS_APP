name: pos_app
description: "A modern POS mobile app with Email & OTP authentication."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  google_fonts: ^6.1.0
  flutter_secure_storage: ^9.0.0
  drift: ^2.16.0
  drift_flutter: ^0.1.0
  path_provider: ^2.1.2
  path: ^1.9.0
  file_picker: ^11.0.3
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.5.0
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

