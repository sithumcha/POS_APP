<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>QuickeApp POS</title>

  <!-- Preconnect & Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- High-Performance Zero-Dependency Vanilla CSS Splash Styles -->
  <style>
    @keyframes floatSoft {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.15); }
    }

    @keyframes subtleDrift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(12px, -15px); }
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    html, body {
      background-color: #F8FAFC !important;
      color: #1E293B;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas, flutter-view, flt-glass-pane, flt-scene-host {
      background-color: #F8FAFC !important;
    }

    #loading-indicator {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background: linear-gradient(to bottom, #F3F7FA, #FAFCFD, #EDF6F2);
      transition: opacity 0.15s ease-out;
      will-change: opacity;
    }

    #loading-indicator.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Force Flutter web canvas container to share identical design background */
    flutter-view, flt-glass-pane, flt-scene-host {
      background-color: #F8FAFC !important;
    }

    .orbs-wrapper {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orb-1 {
      position: absolute;
      top: -6rem;
      left: -5rem;
      width: 20rem;
      height: 20rem;
      border-radius: 9999px;
      background: rgba(110, 231, 183, 0.3);
      filter: blur(75px);
      animation: subtleDrift 8s ease-in-out infinite;
    }

    .orb-2 {
      position: absolute;
      top: 33%;
      right: -6rem;
      width: 22rem;
      height: 22rem;
      border-radius: 9999px;
      background: rgba(153, 246, 228, 0.35);
      filter: blur(85px);
      animation: pulseGlow 3.5s ease-in-out infinite;
    }

    .orb-3 {
      position: absolute;
      bottom: -6rem;
      left: 25%;
      width: 18rem;
      height: 18rem;
      border-radius: 9999px;
      background: rgba(167, 243, 208, 0.25);
      filter: blur(70px);
    }

    .grid-pattern {
      position: absolute;
      inset: 0;
      opacity: 0.035;
      background-image: radial-gradient(#059669 1px, transparent 1px);
      background-size: 18px 18px;
    }

    .splash-core {
      position: relative;
      z-index: 20;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 1.5rem;
    }

    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .logo-container {
      position: relative;
      margin-bottom: 1.5rem;
      animation: floatSoft 4.5s ease-in-out infinite;
    }

    .logo-glow {
      position: absolute;
      inset: -1rem;
      background: linear-gradient(to top right, #00C076, #6EE7B7);
      border-radius: 9999px;
      filter: blur(24px);
      opacity: 0.4;
      animation: pulseGlow 3.5s ease-in-out infinite;
    }

    .logo-card {
      position: relative;
      width: 7rem;
      height: 7rem;
      border-radius: 1.5rem;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 25px -5px rgba(16, 185, 129, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .status-dot-top {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 14px;
      height: 14px;
      background-color: #00C076;
      border-radius: 50%;
      border: 2.5px solid #FFFFFF;
    }

    .brand-title {
      font-size: 2.25rem;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.025em;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .brand-emerald {
      color: #00C076;
    }

    .brand-tagline {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: #94A3B8;
      margin-top: 0.375rem;
      margin-bottom: 0;
    }

    .badge-gateway {
      margin-top: 0.875rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.875rem;
      border-radius: 9999px;
      background: rgba(236, 253, 245, 0.7);
      border: 1px solid #D1FAE5;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      backdrop-filter: blur(4px);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #00C076;
    }

    .badge-text {
      font-size: 0.7rem;
      font-weight: 600;
      color: #047857;
      letter-spacing: 0.02em;
    }

    .progress-section {
      width: 100%;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 1rem;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background-color: rgba(226, 232, 240, 0.6);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 0.875rem;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(to right, #00C076, #2DD4BF, #10B981);
      border-radius: 9999px;
      width: 80%;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .task-status-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #64748B;
      letter-spacing: 0.02em;
    }

    .pulse-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #00C076;
      animation: pulseDot 1.5s ease-in-out infinite;
    }

    .splash-footer {
      position: relative;
      z-index: 20;
      padding-bottom: 2rem;
      display: flex;
      justify-content: center;
    }

    .footer-label {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #94A3B8;
    }

    @keyframes spinLoader {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Suppress browser focus outlines on inputs */
    input, textarea, select, [contenteditable],
    flt-text-editing-host input, flt-text-editing-host textarea,
    flutter-view input, flutter-view textarea {
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
      background: transparent !important;
      appearance: none !important;
      -webkit-appearance: none !important;
    }

    *:focus, *:focus-visible {
      outline: none !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>

  <!-- Full Screen Loading Splash Container -->
  <div id="loading-indicator">
    
    <!-- Background Ambient Lighting Orbs -->
    <div class="orbs-wrapper" aria-hidden="true">
      <div class="orb-1"></div>
      <div class="orb-2"></div>
      <div class="orb-3"></div>
      <div class="grid-pattern"></div>
    </div>

    <!-- Top Spacing -->
    <div style="padding-top: 2rem;"></div>

    <!-- Main Brand Presentation & Progress Center -->
    <div class="splash-core">
      <section class="brand-section">
        <div class="logo-container">
          <div class="logo-glow"></div>
          <div class="logo-card">
            <svg style="width: 4.5rem; height: 4.5rem; color: #00C076;" fill="none" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
              <path class="text-[#00C076]" d="M52 14H24C16.268 14 10 20.268 10 28C10 33.4357 13.0844 38.1561 17.6256 40.4852L14.5 53.5L27.8767 47.9264C29.8398 48.6186 31.8741 49 34 49H52C59.732 49 66 42.732 66 35V28C66 20.268 59.732 14 52 14Z" stroke="#00C076" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"></path>
              <path d="M22 28C22 30.5 23.5 32.5 25 33.5" stroke="#00C076" stroke-linecap="round" stroke-width="2.5"></path>
              <path d="M38 18L26 35H37L33 49L49 31H37L43 18H38Z" fill="#00C076"></path>
            </svg>
            <span class="status-dot-top"></span>
          </div>
        </div>
        <h1 class="brand-title">
          <span>Quicke</span><span class="brand-emerald">App</span>
        </h1>
        <p class="brand-tagline">Sell Smarter, Grow Faster.</p>
        <div class="badge-gateway">
          <span class="badge-dot"></span>
          <span class="badge-text">Cloud Gateway Connected</span>
        </div>
      </section>

      <!-- Minimal Progress Bar -->
      <div class="progress-section">
        <div class="progress-track">
          <div id="progress-fill-bar" class="progress-fill"></div>
        </div>
        <div class="task-status-row">
          <span class="pulse-indicator"></span>
          <span id="active-task-desc">Launching POS Terminal...</span>
        </div>
      </div>
    </div>

    <!-- Security Signature Footer -->
    <footer class="splash-footer">
      <div class="footer-label">
        <svg style="width: 14px; height: 14px; color: #059669;" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
        <span>End-to-End Encrypted POS System</span>
      </div>
    </footer>
  </div>

  <!-- Direct Transition Controller -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const progressBar = document.getElementById('progress-fill-bar');
      if (progressBar) progressBar.style.width = '100%';
    });

    let isSplashDismissed = false;
    window.dismissSplash = function() {
      if (isSplashDismissed) return;
      isSplashDismissed = true;
      const el = document.getElementById('loading-indicator');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(() => {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 120);
      }
    };

    window.dismissPreloader = function() {};

    // Fallback safety only: if Flutter takes unusually long, auto-dismiss after 4.5s
    setTimeout(() => {
      window.dismissSplash();
    }, 4500);
  </script>

  <!-- Flutter Web Bootstrapper -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
